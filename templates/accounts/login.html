{% extends 'base/base.html' %}
{% block title %}Login — GraphRAG{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-16 px-4 bg-gradient-to-br from-brand-pale via-white to-sky-pale">
  <div class="w-full max-w-md">
    <div class="text-center mb-10 fade-up">
      <div class="inline-flex items-center justify-center w-20 h-20 grad-brand rounded-2xl shadow-xl mb-5">
        <span class="text-white text-3xl">🔬</span>
      </div>
      <h1 class="font-display text-4xl font-bold text-gray-900 mb-2">Welcome back</h1>
      <p class="text-gray-500">Sign in to your research workspace</p>
    </div>
    <div class="card p-8 fade-up">
      <form method="post" class="space-y-5">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Username</label>
          <input name="username" type="text" required autocomplete="username"
            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-brand-DEFAULT focus:outline-none text-sm font-mono transition-colors"
            placeholder="your_username">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
          <input name="password" type="password" required
            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-brand-DEFAULT focus:outline-none text-sm font-mono transition-colors"
            placeholder="••••••••">
        </div>
        <button type="submit" class="btn-brand w-full py-3 rounded-xl font-semibold text-sm">Sign In →</button>
      </form>
      <p class="text-center text-sm text-gray-500 mt-5">
        No account? <a href="/accounts/signup/" class="text-brand-DEFAULT font-semibold hover:text-brand-dark ml-1">Sign up free</a>
      </p>
    </div>
    <div class="grid grid-cols-3 gap-3 mt-6 fade-up">
      <div class="bg-brand-pale rounded-xl p-3 text-center">
        <div class="text-xl mb-1">🧠</div><div class="text-xs font-medium text-brand-dark">GraphRAG AI</div>
      </div>
      <div class="bg-sky-pale rounded-xl p-3 text-center">
        <div class="text-xl mb-1">📊</div><div class="text-xs font-medium text-sky-dark">206K arXiv Papers</div>
      </div>
      <div class="bg-brand-pale rounded-xl p-3 text-center">
        <div class="text-xl mb-1">⚡</div><div class="text-xs font-medium text-brand-dark">SVM + FAISS</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
